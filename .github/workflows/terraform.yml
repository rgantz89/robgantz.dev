name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# Pull requests plan with a read-only role. Merges to main apply through the
# "production" environment, which needs approval, with a role scoped to this project.
permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/terraform

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_site_bucket_name: ${{ secrets.S3_BUCKET }}
  TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Lambda unit tests
        working-directory: infra/terraform/lambda
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q

  plan:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=robgantz-dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Validate
        run: terraform validate -no-color
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=2m | tee plan.txt
          {
            echo '### Terraform plan'
            echo
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=robgantz-dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Plan
        run: terraform plan -no-color -lock-timeout=2m -out=tfplan
      - name: Apply
        run: terraform apply -no-color -lock-timeout=2m tfplan
